apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-v1
  labels:
    app: notification-v1
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-v1
  template:
    metadata:
      labels:
        app: notification-v1
        version: v1
    spec:
      containers:
      - name: notification-v1
        image: thiru247/notification-system:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
